name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths: ["digital-twin-and-teleoperation/**", ".github/workflows/deploy-vercel.yml"]
  pull_request:
    paths: ["digital-twin-and-teleoperation/**", ".github/workflows/deploy-vercel.yml"]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WORKDIR: digital-twin-and-teleoperation
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: digital-twin-and-teleoperation/package-lock.json

      - name: Install
        run: npm ci
        working-directory: digital-twin-and-teleoperation

      - name: Build
        run: npm run build
        working-directory: digital-twin-and-teleoperation

      - name: Deploy
        run: npx vercel deploy --prod=${{ github.ref == 'refs/heads/main' }} --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
